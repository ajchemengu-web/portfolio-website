name: ali_juma_portfolio
description: >
  Ali Juma's research portfolio — a Flutter Web front end for the AI/ML and
  Cybersecurity research portfolio platform (public site + admin dashboard).
publish_to: "none"
version: 1.0.0+1

environment:
  # Uses newer Color/ThemeData APIs (Color.withValues, CardThemeData,
  # extended M3 surface roles) — install a current Flutter stable (3.27+;
  # `flutter --version` to check, `flutter upgrade` if needed).
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1

  # Routing
  go_router: ^14.2.7

  # Networking
  http: ^1.2.2

  # Persisting the admin session (access/refresh tokens) across page
  # reloads. On web this is backed by window.localStorage — see
  # docs/SECURITY.md for the tradeoffs of that approach and hardening
  # options (short-lived tokens are already enforced server-side).
  flutter_secure_storage: ^9.2.2

  # Rendering blog post / research content authored as Markdown.
  flutter_markdown: ^0.7.4+1

  # Opening download URLs and external links (GitHub, live demos, DOIs) in
  # a new browser tab from the public site.
  url_launcher: ^6.3.1

  # Native file picker for the admin Media Manager's upload flow (works on
  # web via an in-memory byte read — see FilePickerResult.files[0].bytes).
  file_picker: ^8.1.6

  # Nicer relative dates ("3 days ago") on the blog / activity feed.
  intl: ^0.19.0

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
