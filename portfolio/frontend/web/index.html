<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Ali Juma — AI, Machine Learning &amp; Cybersecurity research portfolio. Research projects, publications, software, and technical writing.">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Ali Juma — Research Portfolio">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Open Graph / social preview -->
  <meta property="og:title" content="Ali Juma — Research Portfolio">

  <meta property="og:type" content="website">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Ali Juma — Research Portfolio</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* Lightweight splash shown before the Flutter engine takes over. */
    html, body { height: 100%; margin: 0; background: #0b1220; }
    #loading {
      position: fixed; inset: 0; display: flex; align-items: center;
      justify-content: center; flex-direction: column; gap: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      color: #e8ecf4;
    }
    .spinner {
      width: 40px; height: 40px; border-radius: 50%;
      border: 3px solid rgba(255,255,255,0.15); border-top-color: #4f7cff;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="loading">
    <div class="spinner"></div>
    <div>Loading portfolio…</div>
  </div>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
